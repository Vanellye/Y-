name: Validate foundation

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run JVM reference validator and manifest checks
        run: bash scripts/validate-provenance.sh
      - name: Verify invalid manifest is rejected
        run: bash tests/validate-provenance.sh
