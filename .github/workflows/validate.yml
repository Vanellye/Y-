name: I.C. Opposition — Yaro foundation validation

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  opposition:
    name: Diagnostic opposition and validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Challenge provenance claims with the JVM reference validator
        run: bash scripts/validate-provenance.sh
      - name: Confirm invalid manifests are rejected
        run: bash tests/validate-provenance.sh
      - name: Cross-check Yaro Ɣơ Kotlin adapter against shared vectors
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin-dist
          /tmp/kotlin-dist/kotlinc/bin/kotlinc language/og/kotlin/YoroStarCodec.kt -include-runtime -d /tmp/yaro-yoro-codec.jar
          java -jar /tmp/yaro-yoro-codec.jar language/og/test-vectors/yoro-star-v2.tsv
